<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="robots" content="noindex">
<title>Chi va là?</title>
<style>
  * { box-sizing: border-box; margin: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    min-height: 100dvh; display: flex; flex-direction: column;
    padding: 16px max(16px, env(safe-area-inset-right)) max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
    background: #fff; color: #000; font: 17px/1.4 Arial, Helvetica, sans-serif;
  }
  body.partenza .testata { visibility: hidden; }
  .testata { font-size: 12px; font-weight: bold; text-transform: uppercase; color: #000; text-decoration: none; }
  main { flex: 1; width: 100%; max-width: 960px; margin: 0 auto; }

  /* tappa */
  .tappa { display: grid; gap: 14px; margin-top: 14px; }
  .intesta { display: flex; align-items: center; gap: 14px; }
  .numero { font-size: 64px; font-weight: bold; line-height: .9; }
  .numero small { display: block; font-size: 11px; margin-top: 4px; }
  h1 { font-size: clamp(22px, 6vw, 32px); line-height: 1.1; }
  video { display: block; width: 100%; aspect-ratio: 16 / 9; background: #000; object-fit: contain; }
  .domanda { font-size: 17px; }
  .errore { font-size: 15px; }

  @media (orientation: landscape) and (max-height: 560px) {
    body { padding-top: 10px; }
    .tappa { grid-template-columns: minmax(150px, 1fr) 3fr; grid-template-rows: auto 1fr; align-items: start; margin-top: 8px; }
    .intesta { flex-direction: column; align-items: flex-start; gap: 10px; }
    video { grid-column: 2; grid-row: 1 / span 2; height: calc(100dvh - 60px); aspect-ratio: auto; }
    .domanda { grid-column: 1; grid-row: 2; font-size: 15px; }
    .tappa h1 { font-size: 20px; }
  }

  /* partenza */
  .home { margin-top: 18vh; max-width: 30em; }
  .home h1 { font-size: clamp(40px, 12vw, 64px); }
  .home .sotto { margin-top: 6px; }
  .home p.nota { margin-top: 32px; }
  button {
    display: block; width: 100%; margin-top: 14px; padding: 16px; border: 2px solid #000;
    border-radius: 0; font: bold 17px Arial, Helvetica, sans-serif; color: #fff; cursor: pointer;
    background: linear-gradient(to right, #000 var(--p, 100%), #666 var(--p, 100%));
  }
  button:disabled { cursor: default; }
  .fatto { background: #fff; color: #000; }

  footer { margin-top: 24px; font-size: 12px; }
  footer:empty { display: none; }
</style>
</head>
<body>
<a class="testata" href="./">Chi va là? · Le Camelie d'autunno</a>
<main id="app"></main>
<footer id="piede"></footer>

<script>
// I video sono video/t1.mp4 … video/t9.mp4. La pagina non scrive mai il nome dell'animale.
const TAPPE = 9;
const CACHE = "chivala-v2";
const video = n => `video/t${n}.mp4`;
const app = document.getElementById("app");
const piede = document.getElementById("piede");

// sw.js salva la pagina, per aprirla anche senza campo
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});

// via le cache di versioni precedenti
if (window.caches) caches.keys().then(ks => ks.filter(k => k.startsWith("chivala-") && k !== CACHE).forEach(k => caches.delete(k)));

async function sorgente(url) {
  try {
    const hit = await (await caches.open(CACHE)).match(url);
    if (hit) return URL.createObjectURL(await hit.blob());
  } catch (e) {}
  return url;
}

async function mostraTappa(n) {
  document.title = `Tappa ${n} · Chi va là?`;
  document.body.classList.remove("partenza");
  piede.textContent = "";
  app.innerHTML = `
    <section class="tappa">
      <div class="intesta">
        <div class="numero">${n}<small>TAPPA</small></div>
        <h1>Chi è passato di qui?</h1>
      </div>
      <video id="v" playsinline controls autoplay muted loop preload="auto"></video>
      <p class="domanda">Che animale è? Di giorno o di notte? Quanti sono?</p>
    </section>`;
  const v = document.getElementById("v");
  v.onerror = () => {
    v.insertAdjacentHTML("afterend", `<p class="errore">Il video non si apre: serve un po' di campo. Riprova tra qualche passo.</p>`);
  };
  v.src = await sorgente(video(n));
}

async function giaScaricati() {
  try {
    const c = await caches.open(CACHE);
    for (let n = 1; n <= TAPPE; n++) if (!(await c.match(video(n)))) return false;
    return true;
  } catch (e) { return false; }
}

function mostraHome() {
  document.title = "Chi va là?";
  document.body.classList.add("partenza");
  piede.textContent = "Sant'Andrea di Compito · Centro Culturale Compitese";
  app.innerHTML = `
    <section class="home">
      <h1>Chi va là?</h1>
      <p class="sotto">Gli animali invisibili del Borgo delle Camelie</p>
      <p class="nota">Scarica i video adesso, allo stand: poi si aprono anche dove non c'è campo.</p>
      <button id="scarica">Scarica i video (13 MB)</button>
    </section>`;
  const b = document.getElementById("scarica");
  const pronto = () => { b.textContent = "Video scaricati"; b.classList.add("fatto"); b.disabled = true; };
  giaScaricati().then(ok => ok && pronto());

  b.onclick = async () => {
    b.disabled = true;
    let fatti = 0, falliti = 0;
    try {
      const c = await caches.open(CACHE);
      for (let n = 1; n <= TAPPE; n++) {
        b.style.setProperty("--p", `${fatti / TAPPE * 100}%`);
        b.textContent = `Scaricamento ${fatti + 1} di ${TAPPE}`;
        try { await c.add(video(n)); } catch (e) { falliti++; }
        fatti++;
      }
      try { await c.add("./"); } catch (e) { falliti++; }
    } catch (e) { falliti = TAPPE; }
    b.style.removeProperty("--p");
    if (!falliti) return pronto();
    b.disabled = false;
    b.textContent = "Non tutti scaricati: riprova";
  };
}

function instrada() {
  const n = parseInt(location.hash.slice(1), 10);
  n >= 1 && n <= TAPPE ? mostraTappa(n) : mostraHome();
  scrollTo(0, 0);
}
addEventListener("hashchange", instrada);
instrada();
</script>
</body>
</html>
